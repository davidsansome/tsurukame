version: 2.1

jobs:
  tsurukame-prober:
    macos:
      xcode: 16.4.0
    resource_class: macos.m1.medium.gen1
    steps:
      - checkout
      - run:
          command: swift test --filter WaniKaniAPIProber.WaniKaniAPIProber
          working_directory: ios/WaniKaniAPI

workflows:
  tsurukame-prober:
    # Only run from the CircleCI schedule trigger, not on every push/PR.
    when:
      equal: [ schedule, << pipeline.trigger.type >> ]
    jobs:
      - tsurukame-prober
